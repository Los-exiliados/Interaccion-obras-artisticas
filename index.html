<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hand tracking</title>
    <link rel="stylesheet" href="./estilo.css" />
  </head>
  <body>
    <video id="camera" autoplay muted playsinline></video>
    <div id="stage"></div>
    <canvas id="overlay"></canvas>

    <script type="module">
      import { createHandTracker } from "./js/handpose.js";
      import { GraphicsEngine, HandMotionEngine } from "./js/gamelogic.js";
      import { HandOverlay } from "./js/ui.js";

      const video = document.querySelector("#camera");
      const canvas = document.querySelector("#overlay");
      const stage = document.querySelector("#stage");

      const mirrorPreview = true;
      const MAX_HANDS = 4;
      const overlay = new HandOverlay({ canvas, video, mirror: mirrorPreview });
      const engine = new HandMotionEngine({ mirror: mirrorPreview, smoothing: 0.55 });

      let tracker = null;
      let stream = null;
      let graphics = null;

      function onFrame({ hands, fps, timestamp }) {
        const frame = engine.update(hands, timestamp);
        overlay.draw(frame.hands);

        // Feeds the p5 graphics engine; phase 3 turns this into hand-driven effects.
        graphics?.updateHands(frame);

        window.handTracking = {
          engine,
          hands: frame.hands,
          byId: frame.byId,
          events: frame.events,
          fps,
          timestamp,
        };
      }

      function resize() {
        overlay.resize();
      }

      async function startGraphics() {
        try {
          // aspect: null -> the canvas fills the whole screen (16:9 was only a reference).
          graphics = await GraphicsEngine.create(stage, { aspect: null });
          window.graphics = graphics; // debug/phase-3 hook, mirrors window.handTracking
        } catch (error) {
          console.error("[graphics] failed to start the p5 engine", error);
        }
      }

      async function start() {
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
          });
          video.srcObject = stream;
          await video.play();
          resize();

          tracker = await createHandTracker({ video, numHands: MAX_HANDS });
          tracker.start(onFrame);
        } catch (error) {
          console.error("[hand tracking]", error);
        }
      }

      window.addEventListener("beforeunload", () => {
        tracker?.stop();
        tracker?.close();
        graphics?.destroy();
        for (const track of stream?.getTracks() ?? []) track.stop();
      });

      new ResizeObserver(resize).observe(canvas);
      window.addEventListener("resize", resize);
      video.addEventListener("loadedmetadata", resize);
      resize();
      startGraphics();
      start();
    </script>
  </body>
</html>
